    <noscript>
      <section aria-labelledby="tavoleero-noscript-title">
        <h1 id="tavoleero-noscript-title">Tavoleero: giochi di società per feste con un solo telefono</h1>
        <article>
          <h2>Scribble Scratch</h2>
          <p><strong>Disegna. Interpreta. Passa.</strong> Nelle modalità Classica e Catena libera parole e disegni si alternano. In Catena muta il primo giocatore sceglie una frase e la disegna; gli altri interpretano in segreto e ridisegnano ciò che vedono, poi il primo assegna un punto alla migliore interpretazione. Da 1 a 8 giocatori.</p>
        </article>
        <article>
          <h2>Parole in fuga</h2>
          <p><strong>Dillo prima che scappi.</strong> Gioco di parole a squadre: prove a tempo Descrivi e Mima, con un mazzo sempre nuovo a ogni prova. Da 3 a 50 giocatori.</p>
        </article>
        <article>
          <h2>Sintonia</h2>
          <p><strong>Stessa parola. Stessa testa.</strong> Completa la frase in segreto: le risposte uguali fanno punti. Da 2 a 8 giocatori.</p>
        </article>
      </section>
    </noscript>
    <script>
      (() => {
        try {
          const COOKIE_KEY = "tavoleero_cookie_choice";
          const BANNER_ID = "tavoleero-cookie-banner";
          const FOOTER_CLASS = "tavoleero-home-footer";
          const AD_ATTRIBUTE = "data-tavoleero-ad";

          function installStyles() {
            try {
              if (document.getElementById("tavoleero-additions-style")) return;
              const style = document.createElement("style");
              style.id = "tavoleero-additions-style";
              style.textContent = `
                #${BANNER_ID} {
                  position: fixed;
                  z-index: 2147483000;
                  right: max(12px, env(safe-area-inset-right));
                  bottom: max(12px, env(safe-area-inset-bottom));
                  left: max(12px, env(safe-area-inset-left));
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 16px;
                  max-width: 920px;
                  margin: 0 auto;
                  padding: 14px 16px;
                  border: 1px solid var(--border, #cfc7b9);
                  border-radius: var(--radius, 14px);
                  background: var(--surface, #fffcf5);
                  color: var(--text, #102a26);
                  box-shadow: var(--shadow, 0 16px 44px rgba(30, 42, 37, .16));
                  font: 500 14px/1.4 "Avenir Next", Avenir, system-ui, sans-serif;
                  pointer-events: none;
                }
                #${BANNER_ID} p { margin: 0; flex: 1 1 420px; pointer-events: none; }
                #${BANNER_ID} .cookie-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; pointer-events: auto; }
                #${BANNER_ID} a,
                .${FOOTER_CLASS} a { color: var(--text, #102a26); text-decoration: underline; text-underline-offset: 3px; }
                #${BANNER_ID} button {
                  min-height: 42px;
                  padding: 9px 14px;
                  border: 1px solid var(--border, #cfc7b9);
                  border-radius: calc(var(--radius, 14px) - 4px);
                  background: var(--surface-2, #ece5d8);
                  color: var(--text, #102a26);
                  font: inherit;
                  font-weight: 700;
                  cursor: pointer;
                }
                #${BANNER_ID} button[data-cookie-choice="accepted"] { border-color: var(--accent, #e84a37); background: var(--accent, #e84a37); color: #fff; }
                .ad-slot[${AD_ATTRIBUTE}] {
                  display: grid;
                  min-height: 72px;
                  place-items: center;
                  margin: 24px 0;
                  padding: 14px;
                  border: 1px dashed var(--border, #cfc7b9);
                  border-radius: var(--radius, 14px);
                  color: var(--dim, #596964);
                  background: color-mix(in srgb, var(--surface, #fffcf5) 72%, transparent);
                  font: 600 12px/1.3 "Avenir Next", Avenir, system-ui, sans-serif;
                  letter-spacing: .04em;
                  text-align: center;
                }
                .${FOOTER_CLASS} {
                  display: flex;
                  justify-content: center;
                  gap: 18px;
                  flex-wrap: wrap;
                  padding: 24px 0 8px;
                  color: var(--dim, #596964);
                  font: 600 13px/1.4 "Avenir Next", Avenir, system-ui, sans-serif;
                  text-align: center;
                }
                .${FOOTER_CLASS} button {
                  padding: 0;
                  border: 0;
                  background: transparent;
                  color: inherit;
                  font: inherit;
                  text-decoration: underline;
                  text-underline-offset: 3px;
                  cursor: pointer;
                }
                @media (max-width: 640px) {
                  #${BANNER_ID} { align-items: stretch; flex-direction: column; gap: 12px; }
                  #${BANNER_ID} p { flex-basis: auto; }
                  #${BANNER_ID} .cookie-actions { justify-content: flex-start; }
                  #${BANNER_ID} .cookie-actions a { flex-basis: 100%; }
                  .ad-slot[${AD_ATTRIBUTE}] { min-height: 64px; margin: 18px 0; }
                }
              `;
              document.head.appendChild(style);
            } catch (_) {}
          }

          function removeCookieBanner() {
            try {
              const banner = document.getElementById(BANNER_ID);
              if (banner) banner.remove();
              const appRoot = document.getElementById("root");
              if (appRoot) appRoot.removeAttribute("inert");
            } catch (_) {}
          }

          function showCookieBanner() {
            try {
              if (document.getElementById(BANNER_ID)) return;
              let choice = null;
              try { choice = window.localStorage.getItem(COOKIE_KEY); } catch (_) {}
              if (choice) return;

              const banner = document.createElement("aside");
              banner.id = BANNER_ID;
              banner.setAttribute("role", "dialog");
              banner.setAttribute("aria-modal", "true");
              banner.setAttribute("aria-label", "Preferenze cookie");
              const appRoot = document.getElementById("root");
              if (appRoot) appRoot.setAttribute("inert", "");
              banner.innerHTML = '<p>Usiamo solo cookie tecnici e il salvataggio locale sul tuo dispositivo per far funzionare l\'app. Niente cookie di tracciamento o pubblicità per ora.</p><div class="cookie-actions"><a href="/privacy">Leggi l\'informativa privacy</a><button type="button" data-cookie-choice="rejected">Rifiuta</button><button type="button" data-cookie-choice="accepted">Accetta</button></div>';
              banner.addEventListener("click", (event) => {
                try {
                  const target = event.target instanceof Element ? event.target.closest("button[data-cookie-choice]") : null;
                  if (!target) return;
                  const selectedChoice = target.getAttribute("data-cookie-choice") || "rejected";
                  try { window.localStorage.setItem(COOKIE_KEY, selectedChoice); } catch (_) {}
                  removeCookieBanner();
                } catch (_) {}
              });
              document.body.appendChild(banner);
              const firstChoice = banner.querySelector('button[data-cookie-choice="rejected"]');
              if (firstChoice instanceof HTMLElement) firstChoice.focus();
            } catch (_) {}
          }

          function createAdSlot(position) {
            try {
              const slot = document.createElement("div");
              slot.className = "ad-slot";
              slot.setAttribute(AD_ATTRIBUTE, position);
              slot.setAttribute("role", "complementary");
              slot.setAttribute("aria-label", "Spazio pubblicitario");
              slot.textContent = "Spazio pubblicitario";
              return slot;
            } catch (_) { return null; }
          }

          function ensureHomeAdditions() {
            try {
              const home = document.querySelector("main.home-page");
              const allSlots = Array.from(document.querySelectorAll(`.ad-slot[${AD_ATTRIBUTE}]`));
              const allFooters = Array.from(document.querySelectorAll(`.${FOOTER_CLASS}`));

              if (!home) {
                allSlots.forEach((slot) => { try { slot.remove(); } catch (_) {} });
                allFooters.forEach((footer) => { try { footer.remove(); } catch (_) {} });
                return;
              }

              const placements = [
                { name: "hero", anchor: home.querySelector("section.home-hero") },
                { name: "freemium", anchor: home.querySelector("section.freemium-strip") },
              ];

              allSlots.forEach((slot) => {
                try {
                  const position = slot.getAttribute(AD_ATTRIBUTE);
                  const placement = placements.find((item) => item.name === position);
                  if (!placement || !placement.anchor || !home.contains(slot)) slot.remove();
                } catch (_) {}
              });

              placements.forEach((placement) => {
                try {
                  if (!placement.anchor) return;
                  const matching = Array.from(home.querySelectorAll(`.ad-slot[${AD_ATTRIBUTE}="${placement.name}"]`));
                  matching.slice(1).forEach((slot) => slot.remove());
                  const slot = matching[0] || createAdSlot(placement.name);
                  if (slot && placement.anchor.nextElementSibling !== slot) placement.anchor.insertAdjacentElement("afterend", slot);
                } catch (_) {}
              });

              Array.from(home.querySelectorAll(`.ad-slot[${AD_ATTRIBUTE}]`)).slice(2).forEach((slot) => {
                try { slot.remove(); } catch (_) {}
              });

              const footers = Array.from(home.querySelectorAll(`.${FOOTER_CLASS}`));
              footers.slice(1).forEach((footer) => { try { footer.remove(); } catch (_) {} });
              let footer = footers[0];
              if (!footer) {
                footer = document.createElement("footer");
                footer.className = FOOTER_CLASS;
                footer.innerHTML = '<a href="/privacy">Privacy</a><button type="button">Preferenze cookie</button>';
                const preferencesButton = footer.querySelector("button");
                if (preferencesButton) {
                  preferencesButton.addEventListener("click", () => {
                    try { window.localStorage.removeItem(COOKIE_KEY); } catch (_) {}
                    removeCookieBanner();
                    showCookieBanner();
                  });
                }
              }
              if (footer.parentElement !== home || home.lastElementChild !== footer) home.appendChild(footer);
            } catch (_) {}
          }

          function startAdditions() {
            try {
              installStyles();
              showCookieBanner();
              ensureHomeAdditions();
              const observer = new MutationObserver(() => {
                try { ensureHomeAdditions(); } catch (_) {}
              });
              observer.observe(document.body, { childList: true, subtree: true });
            } catch (_) {}
          }

          try {
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startAdditions, { once: true });
            else startAdditions();
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
  </body>
